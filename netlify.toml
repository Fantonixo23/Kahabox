# Kahabox — configuración de build para Netlify (raíz del repo).
# Base directory de Netlify debe quedar VACÍO (raíz del repo).
# Monorepo npm con workspaces: `npm run build` desde la raíz compila `web` con
# el script "build": "npm run build -w web" y deja la salida en web/dist.
# No debe existir un netlify.toml dentro de web/ (Netlify le daría prioridad
# por el package directory y resolvería "publish" relativo a la raíz).
[build]
  command = "npm run build"
  publish = "web/dist"

# APK de la app Android: vive en el último GitHub Release y se expone en una URL
# fija del sitio. Va ANTES del fallback SPA para que no lo capture index.html.
# Se genera con el workflow .github/workflows/android.yml.
[[redirects]]
  from = "/kahabox-caja.apk"
  to = "https://github.com/Fantonixo23/Kahabox/releases/latest/download/kahabox-caja.apk"
  status = 302
  force = true

# Fallback SPA: todas las rutas del cliente (login, /app/*, /escaneo y los futuros
# links de aprobación) sirven index.html con status 200.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad básicos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
