<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf6f1" />
    <meta
      name="description"
      content="Kahabox — gestión de stock para tiendas revendedoras"
    />
    <title>Kahabox — Gestión de stock</title>
    <script>
      try {
        var raw = localStorage.getItem('kahabox:config')
        var tema = raw ? JSON.parse(raw).tema : null
        if (tema === 'oscuro') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
