# Kahabox — Configuración local de Supabase
# Referencia: https://supabase.com/docs/guides/cli/config

project_id = "kahabox"
project_name = "Kahabox"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15
seed_filepath = "./seed.sql"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "5MB"

[storage.buckets.productos]
public = true
file_size_limit = "5MB"